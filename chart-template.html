<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>GitHub activity chart</title>
  <style>
    :root { color-scheme: light dark; --viz-series-1: var(--chart-1, light-dark(#388bfd,#58a6ff)); --viz-series-2:var(--chart-2,light-dark(#1a7f37,#3fb950)); --viz-series-3:var(--chart-3,light-dark(#8250df,#bc8cff)); }
    * { box-sizing: border-box; }
    html,body { margin:0; background:transparent; }
    body { font:14px/1.5 var(--font-sans, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif); color:var(--foreground,light-dark(#1f2328,#f0f6fc)); }
    #github-activity { padding:12px 0 4px; }
    #github-activity header { display:flex; align-items:center; gap:12px; margin-bottom:12px; }
    #github-activity img { width:46px; height:46px; border-radius:50%; flex-shrink:0; }
    #github-activity h1 { font:500 18px/1.5 var(--font-sans, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif); margin:0; }
    #github-activity a { color:inherit; text-decoration:none; }
    #github-activity .secondary { color:var(--muted-foreground,light-dark(#59636e,#9da7b3)); }
    #github-activity p { margin:0; }
    #github-activity svg { display:block; width:100%; height:256px; overflow:visible; }
    #github-activity svg text { fill:var(--foreground,light-dark(#1f2328,#f0f6fc)); font-size:12px; }
    #github-activity .grid { stroke:var(--border,light-dark(#d1d9e0,#3d444d)); stroke-opacity:.6; stroke-width:1; }
    #github-activity .bar { fill:var(--viz-series-1); }
    #github-activity .bar:last-of-type { opacity:.65; }
    #github-activity .detail { min-height:48px; font-variant-numeric:tabular-nums; }
    #github-activity footer { margin-top:6px; font-size:12px; }
    #github-activity #legend { display:flex; flex-wrap:wrap; gap:6px 20px; margin-bottom:10px; font-size:12px; }
    #github-activity #legend[hidden] { display:none; }
    #github-activity .legend-item { display:inline-flex; align-items:center; gap:6px; }
    #github-activity .legend-item::before { content:""; width:9px; height:9px; background:var(--series-color); }
  </style>
</head>
<body>
  <section id="github-activity" aria-label="Monthly GitHub activity">
    <header>
      <img id="avatar" alt="">
      <div><h1><a id="profile"></a></h1><p id="total" class="secondary"></p></div>
    </header>
    <div id="legend" aria-label="Contribution types" hidden></div>
    <svg id="chart" role="img" aria-labelledby="chart-title chart-description"></svg>
    <p id="detail" class="detail secondary" aria-live="polite"></p>
    <footer class="secondary"><span id="coverage"></span> <span id="stamp"></span></footer>
  </section>
  <script>
    (() => {
      const data = __CHART_DATA__;
      const daily = Array.isArray(data.daily);
      const contribution = data.kind==='contributions';
      const categories = [['prs_shipped','PRs shipped'],['reviews','PR reviews'],['comments','Comments']];
      const kind = {
        activity:{title:'activity',label:'Monthly GitHub activity',measure:'activities',axis:'Activities / month',
          coverage:'Comments and PR closures reflect account access. Latest month is partial.',
          description:'Profile contributions plus issue/PR conversation comments, commit comments, and closures of authored PRs. Latest month partial.'},
        commits:{title:'commits YTD',label:'Daily year-to-date commits',measure:'commits YTD',axis:'Commits / day',unit:['commit','commits'],
          summary:'Authored commits per day · zero-commit days included',
          coverage:'Accessible default branches. UTC author dates. Today is partial.',
          description:'Daily authored commits on accessible default branches, grouped by UTC author date. Zero-commit days included. Today partial.'},
        contributions:{title:'contributions YTD',label:'Daily year-to-date contributions',measure:'contributions YTD',axis:'Contributions / day',
          coverage:'Accessible merged PRs, submitted reviews, and posted comments. UTC dates. Today is partial.',
          description:'Daily merged PRs authored by the account, submitted reviews, and posted comments. Zero-contribution days included. Today partial.'},
        profile_contributions:{title:'profile contributions',label:'Monthly GitHub profile contributions',measure:'profile contributions',axis:'Contributions / month',unit:['profile contribution','profile contributions'],
          summary:'GitHub profile calendar: commits, opened PRs and issues, PR reviews, and discussions',
          coverage:'Available private activity included. Latest month is partial.',
          description:'Monthly GitHub profile contributions, such as commits, opened PRs and issues, and submitted PR reviews. Latest month partial.'},
        prs_closed:{title:'PRs closed',label:'Monthly authored PRs closed',measure:'authored PRs closed',axis:'PRs closed / month',unit:['PR closed','PRs closed'],
          summary:'Authored PRs merged or closed without merging, on their latest UTC closure dates',
          coverage:'Closures reflect account access. Latest month is partial.',
          description:'Monthly authored PRs that were merged or closed without merging, counted on their latest UTC closure dates. Latest month partial.'},
      }[data.kind];
      document.title = `GitHub ${kind.title} · ${data.login}`;
      const root = document.getElementById('github-activity');
      root.setAttribute('aria-label',kind.label);
      const chart = root.querySelector('#chart');
      const detail = root.querySelector('#detail');
      const rows = daily?data.daily:data.monthly;
      const dateValue = row => daily?row.date:row.month+'-01';
      const formatLabel = row => new Date(dateValue(row)+'T00:00:00Z').toLocaleDateString('en-GB',{...(daily?{day:'numeric'}:{}),month:'short',year:'numeric',timeZone:'UTC'});
      const range = `${formatLabel(rows[0])} – ${formatLabel(rows.at(-1))}`;
      const measure = kind.measure;
      const profile = root.querySelector('#profile');
      profile.textContent = data.login;
      profile.href = data.url;
      root.querySelector('#avatar').src = data.avatar;
      root.querySelector('#total').textContent = `${data.total.toLocaleString()} ${measure} · ${range}`;
      root.querySelector('#coverage').textContent = kind.coverage;
      root.querySelector('#stamp').textContent = 'As of '+new Date(data.asOf).toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric',timeZone:'UTC'})+'.';
      const totals = key => rows.reduce((sum,row)=>sum+row[key],0).toLocaleString();
      const contributionDetail = row => `${formatLabel(row)} · ${row.count.toLocaleString()} ${row.count===1?'contribution':'contributions'}: ${row.prs_shipped} ${row.prs_shipped===1?'PR':'PRs'} shipped + ${row.reviews} ${row.reviews===1?'review':'reviews'} + ${row.comments} ${row.comments===1?'comment':'comments'}`;
      const countDetail = (row,index) => `${formatLabel(row)} · ${row.count.toLocaleString()} ${kind.unit[row.count===1?0:1]}${index===rows.length-1?(daily?' (today, partial)':' (partial)'):''}`;
      const summary = contribution?contributionDetail(rows.at(-1)):data.kind==='activity'?`${totals('profile_contributions')} profile contributions + ${totals('comments')} comments + ${totals('prs_closed')} authored PR closures`:kind.summary;
      detail.textContent = summary;
      const legend=root.querySelector('#legend');
      legend.hidden=!contribution;
      if(contribution)categories.forEach(([key,label],index)=>{
        const item=document.createElement('span');
        item.className='legend-item';
        item.style.setProperty('--series-color',`var(--viz-series-${index+1})`);
        item.textContent=`${label}: ${totals(key)}`;
        legend.append(item);
      });
      const ns = 'http://www.w3.org/2000/svg';
      const add = (name, attrs, text, parent=chart) => {
        const element = document.createElementNS(ns,name);
        for (const [key,value] of Object.entries(attrs)) element.setAttribute(key,value);
        if (text !== undefined) element.textContent = text;
        parent.append(element);
        return element;
      };
      function draw() {
        const width = root.clientWidth;
        const height = 256;
        const left = 5, right = width-68, top=30, bottom=204;
        const maximum = Math.max(...rows.map(row=>row.count));
        const roughStep = Math.max(1,maximum/4);
        const magnitude = 10**Math.floor(Math.log10(roughStep));
        const ceiling = 4*[1,2,5,10].map(unit=>unit*magnitude).find(value=>value>=roughStep);
        const step = (right-left)/rows.length;
        chart.replaceChildren();
        chart.setAttribute('viewBox',`0 0 ${width} ${height}`);
        add('title',{id:'chart-title'},`${data.login}: ${data.total.toLocaleString()} ${measure}`);
        add('desc',{id:'chart-description'},`${range}. ${kind.description}`);
        add('text',{x:left,y:15,class:'axis-title','data-axis':'y'},kind.axis);
        for(let i=0;i<5;i++) {
          const count=ceiling*i/4, y=bottom-(bottom-top)*count/ceiling;
          add('line',{x1:left,y1:y,x2:right,y2:y,class:'grid'});
          add('text',{x:right+10,y:y+4},Math.round(count).toLocaleString());
        }
        add('rect',{x:left,y:top,width:right-left,height:bottom-top,fill:'none',class:'grid','data-chart-frame':''});
        const candidates = width<480 ? [0,Math.floor((rows.length-1)/2),rows.length-1] : rows.map((row,i)=>(daily?row.date.endsWith('-01') && Number(row.date.slice(5,7))%2===1:row.month.endsWith('-01') && (Number(row.month.slice(0,4))-Number(rows[0].month.slice(0,4)))%2===0) ? i : -1).filter(i=>i>=0).concat(rows.length-1);
        const ticks = [...new Set(candidates)].filter(index=>index===0 || index===rows.length-1 || (rows.length-1-index)*step>=65);
        ticks.forEach(index=>{
          const x=left+step*(index+.5);
          const anchor=index===0?'start':index===rows.length-1?'end':'middle';
          const tickLabel = daily?new Date(dateValue(rows[index])+'T00:00:00Z').toLocaleDateString('en-GB',{...(width<480 || index===rows.length-1?{day:'numeric'}:{}),month:'short',timeZone:'UTC'}):formatLabel(rows[index]);
          add('text',{x,y:227,'text-anchor':anchor},tickLabel);
        });
        rows.forEach((row,index)=>{
          const barHeight=(bottom-top)*row.count/ceiling;
          const gap=Math.min(.9,step*.2);
          const attrs={class:'bar',opacity:index===rows.length-1?.65:1,'data-date':dateValue(row),'data-count':row.count};
          if(contribution){
            const group=add('g',attrs);
            let running=0;
            categories.forEach(([key],series)=>{
              const height=(bottom-top)*row[key]/ceiling;
              running+=height;
              add('rect',{x:left+step*index+gap/2,y:bottom-running,width:step-gap,height,fill:`var(--viz-series-${series+1})`,'data-category':key,'data-value':row[key]},undefined,group);
            });
          } else add('rect',{...attrs,x:left+step*index+gap/2,y:bottom-barHeight,width:step-gap,height:barHeight});
        });
        const peak=rows.findIndex(row=>row.count===maximum);
        const peakX=left+step*(peak+.5);
        add('text',{x:peakX,y:bottom-(bottom-top)*maximum/ceiling-9,'text-anchor':peakX<left+25?'start':peakX>right-25?'end':'middle'},maximum.toLocaleString());
        add('text',{x:(left+right)/2,y:250,'text-anchor':'middle',class:'axis-title','data-axis':'x'},daily?'Date (UTC)':'Month');
        const hit=add('rect',{x:left,y:top,width:right-left,height:bottom-top,fill:'transparent','data-chart-hit':''});
        const show = event => {
          const bounds=chart.getBoundingClientRect();
          const index=Math.min(rows.length-1,Math.max(0,Math.floor((event.clientX-bounds.left-left)/step)));
          const row=rows[index];
          detail.textContent=contribution?contributionDetail(row):data.kind==='activity'?`${formatLabel(row)} · ${row.count.toLocaleString()} activities${index===rows.length-1?' (partial)':''}: ${row.profile_contributions} profile + ${row.comments} comments + ${row.prs_closed} PR closures`:countDetail(row,index);
        };
        hit.addEventListener('pointermove',show);
        hit.addEventListener('click',show);
        chart.onpointerleave=()=>detail.textContent=summary;
      }
      new ResizeObserver(draw).observe(root);
      draw();
      requestAnimationFrame(()=>{
        const bars=chart.querySelectorAll('.bar');
        const sum=[...bars].reduce((total,bar)=>total+Number(bar.dataset.count),0);
        if(bars.length!==rows.length || sum!==data.total) throw Error('Chart totals do not match source data');
        if(document.documentElement.scrollWidth>innerWidth) throw Error('Chart overflows the page');
        const boxes=[...chart.querySelectorAll('text')].map(node=>({text:node.textContent,...Object.fromEntries(['x','y','width','height'].map(key=>[key,node.getBBox()[key]]))}));
        if(boxes.some(box=>box.x<0 || box.x+box.width>root.clientWidth+1)) throw Error('Chart label is clipped');
        console.log(JSON.stringify({period:daily?'day':'month',points:bars.length,total:sum,width:root.clientWidth,height:root.getBoundingClientRect().height,labelsFit:true}));
      });
    })();
  </script>
</body>
</html>
